    <linearGradient id="porcelain" x1="7" y1="3" x2="18" y2="23" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".5" stop-color="white" stop-opacity=".96"/><stop offset="1" stop-color="white" stop-opacity=".74"/></linearGradient>
