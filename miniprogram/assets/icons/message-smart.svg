<!-- Based on Lucide "bot" icon geometry (ISC); white relief on a colored gradient tile, matching message-notice.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tile" x1="6" y1="0" x2="42" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#9b8cf5"/><stop offset="1" stop-color="#5e4fd6"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(12 5) rotate(55) scale(39 34)" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".28"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
    <linearGradient id="porcelain" x1="7" y1="3" x2="18" y2="23" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".5" stop-color="white" stop-opacity=".96"/><stop offset="1" stop-color="white" stop-opacity=".74"/></linearGradient>
    <filter id="relief" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="1.2" stdDeviation=".8" flood-color="#5e4fd6" flood-opacity=".45"/></filter>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#tile)"/>
  <rect width="48" height="48" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="47" height="47" rx="13.5" stroke="white" stroke-opacity=".22"/>
  <g transform="translate(9 9) scale(1.25)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="url(#porcelain)" stroke="white" stroke-opacity=".7" stroke-width=".6" filter="url(#relief)"><rect x="4" y="8" width="16" height="12" rx="2"/></g>
    <g stroke="white" stroke-width="1.6"><path d="M12 8V4H8"/><path d="M2 14h2"/><path d="M20 14h2"/></g>
    <g stroke="#5e4fd6" stroke-width="1.8"><path d="M9 13v2"/><path d="M15 13v2"/></g>
  </g>
</svg>
